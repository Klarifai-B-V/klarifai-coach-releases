name: Client installer

# Builds one client's Windows installer from the private repo
# Klarifai-B-V/klarifai-coach on GitHub's free runners for public repos, with
# its update signature and latest.json. Publishing stays a manual step
# (klanten/README.md in klarifai-coach, stap 5).
#
# The source arrives encrypted, as an asset of the draft release "bron" (drafts
# are not public), with a new key for every build:
#   gg-app/scripts/bron-naar-releases.sh <klant>   (in klarifai-coach)
# The environment klant-installer holds that key and the update key, for main
# only, and asks Romano's approval for every run.
#
# No job holds both the keys and write access to this repo, where the
# installers and latest.json live. Reading a draft needs write access, so the
# job "bron" fetches the package without third-party code and hands it on
# still encrypted; the job "installer" decrypts and builds with a read-only
# token.
#
# Logs and artifacts of a public repo are public: no step prints a secret or
# source. The artifacts hold the encrypted package (until
# bron-naar-releases.sh --opruimen, a day at most) and what gets published
# anyway.

on:
  workflow_dispatch:
    inputs:
      klant:
        description: "Folder under klanten/, for example highlife"
        required: true
        type: string
      bron:
        description: "Commit of klarifai-coach the source package was made from"
        required: true
        type: string
      bron_sha256:
        description: "SHA-256 of the unencrypted source package"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: klant-installer
  cancel-in-progress: false

jobs:
  bron:
    name: source package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Only to read the draft release "bron"; drafts need write access.
      contents: write
    steps:
      - name: Inputs
        shell: bash
        env:
          KLANT: ${{ inputs.klant }}
          BRON: ${{ inputs.bron }}
          BRON_SHA256: ${{ inputs.bron_sha256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Run this workflow from main" >&2; exit 1; }
          [[ "$KLANT" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "klant must be a folder name under klanten/" >&2; exit 1; }
          [[ "$BRON" =~ ^[0-9a-f]{40}$ ]] || { echo "bron must be a full commit hash" >&2; exit 1; }
          [[ "$BRON_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "bron_sha256 must be a SHA-256" >&2; exit 1; }

      - name: Encrypted source package (draft release "bron")
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRON: ${{ inputs.bron }}
        run: |
          set -euo pipefail
          asset="klarifai-coach-$BRON.tar.gz.enc"
          url=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -q ".[] | select(.draft and .name == \"bron\") | .assets[] | select(.name == \"$asset\") | .url" | head -n 1)
          [[ -n "$url" ]] || { echo "The draft release bron has no $asset" >&2; exit 1; }
          mkdir bron
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o "bron/$asset" "$url"

      - uses: actions/upload-artifact@v7
        with:
          name: bron
          path: bron/
          if-no-files-found: error
          retention-days: 1
          # Encrypted data does not compress.
          compression-level: 0

  installer:
    name: installer · ${{ inputs.klant }}
    needs: bron
    runs-on: windows-latest
    # Cold cache: the Tauri dependency tree plus two bundles (NSIS and MSI).
    timeout-minutes: 90
    environment: klant-installer
    # No permissions block: the workflow's read-only token, as this job holds the keys.
    steps:
      # shell: bash on every step: PowerShell only fails on the last line.
      - name: Keys
        shell: bash
        env:
          COACH_SOURCE_KEY: ${{ secrets.COACH_SOURCE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in COACH_SOURCE_KEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "Missing environment secret: $name" >&2; exit 1; }
          done

      - uses: actions/download-artifact@v8
        with:
          name: bron

      # Relative paths on purpose: Git Bash's tar reads "D:\..." as a remote host.
      - name: Source package (decrypt, check, unpack)
        shell: bash
        env:
          BRON: ${{ inputs.bron }}
          BRON_SHA256: ${{ inputs.bron_sha256 }}
          COACH_SOURCE_KEY: ${{ secrets.COACH_SOURCE_KEY }}
        run: |
          set -euo pipefail
          package="klarifai-coach-$BRON.tar.gz.enc"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 600000 -pass env:COACH_SOURCE_KEY -in "$package" -out bron.tar.gz
          rm -f "$package"
          echo "$BRON_SHA256  bron.tar.gz" | sha256sum -c -
          tar -xzf bron.tar.gz
          rm -f bron.tar.gz
          echo "klarifai-coach $BRON" > BUILD-COMMIT.txt

      # pnpm version comes from package.json's packageManager field.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gg-app/src-tauri

      - name: Install
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build framework packages
        shell: bash
        run: |
          pnpm --filter @kenkaiiii/gg-ai build
          pnpm --filter @kenkaiiii/gg-agent build
          pnpm --filter @kenkaiiii/gg-core build
          pnpm --filter @kenkaiiii/ggcoder build

      - name: Stage node runtime + bundle sidecar
        shell: bash
        run: |
          pnpm --filter gg-app stage:node
          pnpm --filter gg-app bundle:sidecar

      - name: Sidecar smoke (bundled runtime + bundle)
        shell: bash
        run: node gg-app/scripts/smoke-sidecar.mjs

      # Only this step sees the update key. Tauri signs each installer with it
      # and writes the signature next to it (<installer>.sig).
      - name: Build the client installer (NSIS + MSI, with update signatures)
        shell: bash
        env:
          KLANT: ${{ inputs.klant }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          rm -rf gg-app/src-tauri/target/release/bundle
          node gg-app/scripts/build-klant.mjs "$KLANT" --ci --bundles nsis,msi

      # Gate: an installer signed with another key than tauri.conf.json carries
      # would be an update every installed app refuses without a word.
      - name: Update manifest (latest.json, signature checked against tauri.conf.json)
        shell: bash
        env:
          KLANT: ${{ inputs.klant }}
        run: |
          set -euo pipefail
          bundle=gg-app/src-tauri/target/release/bundle
          installers=("$bundle"/nsis/*-setup.exe)
          [[ ${#installers[@]} -eq 1 && -f "${installers[0]}" ]] || {
            echo "expected exactly one NSIS installer in $bundle/nsis" >&2
            exit 1
          }
          node gg-app/scripts/update-manifest.mjs "$KLANT" "${installers[0]}" "$bundle/latest.json"
          node gg-app/scripts/update-manifest.mjs --controleer "$bundle/latest.json" "${installers[0]}"
          cp BUILD-COMMIT.txt "$bundle/BUILD-COMMIT.txt"

      - name: Checksums
        shell: bash
        working-directory: gg-app/src-tauri/target/release/bundle
        run: sha256sum nsis/*.exe nsis/*.exe.sig msi/*.msi latest.json BUILD-COMMIT.txt | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ inputs.klant }}
          path: |
            gg-app/src-tauri/target/release/bundle/nsis/*.exe
            gg-app/src-tauri/target/release/bundle/nsis/*.exe.sig
            gg-app/src-tauri/target/release/bundle/msi/*.msi
            gg-app/src-tauri/target/release/bundle/latest.json
            gg-app/src-tauri/target/release/bundle/BUILD-COMMIT.txt
            gg-app/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          # Installers are already compressed.
          compression-level: 0

      # Gate: the packaged client app must come up with a visible window and
      # the bundled sidecar. It runs after the upload, so a failing launch
      # still leaves the installer to inspect. Never publish a red run.
      - name: Packaged app smoke (client MSI launch)
        shell: bash
        run: |
          msi="$(ls gg-app/src-tauri/target/release/bundle/msi/*.msi | head -n 1)"
          node gg-app/scripts/smoke-packaged-windows.mjs --artifact "$msi"
